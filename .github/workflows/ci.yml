name: CI

on:
  push:
    branches: [ master, staging, 'feature/**', 'fix/**' ]
  pull_request:

jobs:
  tests:
    name: PHP ${{ matrix.php }} tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '8.3', '8.4' ]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rc
          POSTGRES_PASSWORD: rc
          POSTGRES_DB: rc_admin_test
        ports: [ '5433:5432' ]
        options: >-
          --health-cmd "pg_isready -U rc"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, pdo_pgsql, pgsql, gd, zip, xml, xsl, curl, bcmath
          coverage: none

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-${{ matrix.php }}-

      - name: Install dependencies
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: Lint
        run: find app config database routes tests -name '*.php' -print0 2>/dev/null | xargs -0 -n 50 php -l > /dev/null

      - name: Static analysis
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Run tests
        run: vendor/bin/phpunit
        env:
          DB_HOST: 127.0.0.1
          DB_PORT: 5433
